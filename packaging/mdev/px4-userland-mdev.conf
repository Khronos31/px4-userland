# BusyBox mdev hotplug rules for the PLEX PX-Q3U4, PLEX PX-MLT5PE, and
# e-Better DTV02A-5TS-P USB tuners.
# Prepend this fragment to /etc/mdev.conf, before generic USB/$MODALIAS rules.
# The hotplug rule includes DEVTYPE and PRODUCT and is intentionally exact.
DEVTYPE=usb_device;PRODUCT=511/84a/.*;bus/usb/[0-9]+/[0-9]+ root:video 0660
DEVTYPE=usb_device;PRODUCT=511/24e/.*;bus/usb/[0-9]+/[0-9]+ root:video 0660
DEVTYPE=usb_device;PRODUCT=511/924e/.*;bus/usb/[0-9]+/[0-9]+ root:video 0660
